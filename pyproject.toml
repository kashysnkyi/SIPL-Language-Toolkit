[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-language-toolkit"
version = "0.1.0"
description = "Parser, interpreter, visualizers and semantic-term builder for the SIPL teaching language"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Владислав Кашинський"}]
dependencies = ["lark>=1.1.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sipl = "sipl.cli:main"
sipl-web = "sipl.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sipl.grammar" = ["*.lark"]
"sipl.webui" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sipl"]
branch = true
omit = ["src/sipl/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

