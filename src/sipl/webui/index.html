<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIPL Language Toolkit</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #131b31;
      --panel2: #19243d;
      --line: #2a395b;
      --text: #e8edf8;
      --muted: #9eabc6;
      --accent: #7aa2ff;
      --accent2: #55d6be;
      --danger: #ff718c;
      --shadow: 0 18px 55px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 5% 0%, rgba(122, 162, 255, .18), transparent 34%),
        radial-gradient(circle at 100% 10%, rgba(85, 214, 190, .10), transparent 30%),
        var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px clamp(20px, 5vw, 70px);
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(11,16,32,.72);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 12px; font: 700 16px ui-monospace, monospace;
      background: linear-gradient(135deg, var(--accent), #9b7aff);
      box-shadow: 0 8px 26px rgba(122,162,255,.28);
    }
    h1 { margin: 0; font-size: 20px; }
    header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .local { color: var(--accent2); font-size: 13px; }
    main { padding: 28px clamp(16px, 4vw, 60px) 50px; max-width: 1600px; margin: auto; }
    .workspace { display: grid; grid-template-columns: minmax(430px, .9fr) minmax(480px, 1.1fr); gap: 22px; }
    .card { background: rgba(19,27,49,.94); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .card-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .card-head h2 { margin: 0; font-size: 15px; }
    select, input, textarea, button { font: inherit; }
    select, input {
      color: var(--text); background: var(--panel2); border: 1px solid var(--line);
      border-radius: 9px; padding: 9px 11px; outline: none;
    }
    textarea {
      display: block; width: 100%; min-height: 470px; resize: vertical;
      border: 0; outline: 0; padding: 19px 20px; color: #eaf0ff;
      background: #0e1528; font: 14px/1.65 "Cascadia Code", Consolas, monospace;
      tab-size: 2;
    }
    .controls { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
    .state-row { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    button { border: 1px solid var(--line); color: var(--text); background: var(--panel2); border-radius: 10px; padding: 10px 15px; cursor: pointer; font-weight: 650; }
    button:hover { transform: translateY(-1px); border-color: #506a9e; }
    button.primary { background: linear-gradient(135deg, #5f8eff, #806cff); border: 0; }
    button.run { background: linear-gradient(135deg, #2fae95, #2587a9); border: 0; }
    .status { min-height: 40px; padding: 11px 14px; margin-bottom: 14px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
    .status.ok { color: var(--accent2); border-color: rgba(85,214,190,.4); }
    .status.error { color: var(--danger); border-color: rgba(255,113,140,.45); white-space: pre-wrap; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .metric { padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 5px; font-size: 18px; }
    .tabs { display: flex; overflow-x: auto; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 14px; }
    .tab { background: transparent; border: 0; border-radius: 0; padding: 13px 12px; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .result-body { min-height: 525px; max-height: 720px; overflow: auto; padding: 16px; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.55 "Cascadia Code", Consolas, monospace; color: #dce7ff; }
    .term { padding: 15px; border-radius: 12px; background: #0e1528; border: 1px solid var(--line); font: 14px/1.6 "Cascadia Code", Consolas, monospace; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); position: sticky; top: 0; background: var(--panel); }
    .hidden { display: none; }
    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      textarea { min-height: 390px; }
      header { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">SIPL</div>
      <div><h1>Language Toolkit</h1><p>Parser · AST · Interpreter · Semantics</p></div>
    </div>
    <div class="local">● локальний сервер</div>
  </header>
  <main>
    <div class="workspace">
      <section class="card">
        <div class="card-head">
          <h2>Вихідна програма</h2>
          <select id="sample">
            <option value="parity">Парність</option>
            <option value="power">Степінь</option>
            <option value="gcd">НСД</option>
            <option value="custom">Власний код</option>
          </select>
        </div>
        <textarea id="source" spellcheck="false"></textarea>
        <div class="controls">
          <div class="state-row">
            <input id="state" value="N=5" placeholder="Початковий стан: N=5">
            <input id="limit" type="number" value="10000" min="1" title="Ліміт кроків">
          </div>
          <div class="actions">
            <button class="primary" id="analyze">Перевірити й побудувати</button>
            <button class="run" id="run">Виконати</button>
            <button id="clear">Очистити результат</button>
          </div>
        </div>
      </section>

      <section>
        <div id="status" class="status">Оберіть приклад і натисніть кнопку.</div>
        <div class="summary">
          <div class="metric"><span>Кроки</span><strong id="steps">-</strong></div>
          <div class="metric"><span>AST-вузли</span><strong id="astCount">-</strong></div>
          <div class="metric"><span>Parse tree</span><strong id="treeCount">-</strong></div>
        </div>
        <div class="card">
          <div class="tabs">
            <button class="tab active" data-tab="statePanel">Стан</button>
            <button class="tab" data-tab="semanticPanel">Семантичний терм</button>
            <button class="tab" data-tab="astPanel">AST</button>
            <button class="tab" data-tab="tracePanel">Trace</button>
          </div>
          <div class="result-body">
            <div id="statePanel"><pre id="stateOut">Результату ще немає.</pre></div>
            <div id="semanticPanel" class="hidden"><div id="term" class="term">-</div></div>
            <div id="astPanel" class="hidden"><pre id="astOut">-</pre></div>
            <div id="tracePanel" class="hidden">
              <table><thead><tr><th>#</th><th>Подія</th><th>Позиція</th><th>Дані</th></tr></thead><tbody id="trace"></tbody></table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script>
    const samples = {
      parity: { state: 'N=5', source: `begin
  while N > 1 do
    N := N - 2;
  if N = 1 then
    R := 1
  else
    R := 0
end` },
      power: { state: 'X=2,Y=5', source: `begin
  R := 1;
  while Y > 0 do
  begin
    R := R * X;
    Y := Y - 1
  end
end` },
      gcd: { state: 'M=48,N=18', source: `begin
  while not (M = N) do
    if M > N then
      M := M - N
    else
      N := N - M
end` }
    };
    const $ = id => document.getElementById(id);
    function loadSample(name) {
      if (!samples[name]) return;
      $('source').value = samples[name].source;
      $('state').value = samples[name].state;
    }
    function showStatus(text, type='') { $('status').textContent = text; $('status').className = `status ${type}`; }
    function setTab(id) {
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === id));
      ['statePanel','semanticPanel','astPanel','tracePanel'].forEach(x => $(x).classList.toggle('hidden', x !== id));
    }
    async function api(path, body) {
      const response = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const data = await response.json();
      if (!response.ok || !data.ok) throw data.error || {message:'Невідома помилка'};
      return data;
    }
    function errorText(error) {
      let text = error.message || String(error);
      if (error.line) text += `\nРядок ${error.line}, колонка ${error.column}`;
      if (error.context) text += `\n${error.context}`;
      return text;
    }
    $('sample').addEventListener('change', e => loadSample(e.target.value));
    $('source').addEventListener('input', () => $('sample').value = 'custom');
    document.querySelectorAll('.tab').forEach(x => x.addEventListener('click', () => setTab(x.dataset.tab)));
    $('clear').addEventListener('click', () => {
      showStatus('Результат очищено.'); $('stateOut').textContent='-'; $('astOut').textContent='-'; $('term').textContent='-'; $('trace').innerHTML='';
      $('steps').textContent=$('astCount').textContent=$('treeCount').textContent='-';
    });
    $('analyze').addEventListener('click', async () => {
      showStatus('Аналізую програму…');
      try {
        const data = await api('/api/analyze', {source:$('source').value});
        $('astOut').textContent = JSON.stringify(data.ast, null, 2);
        $('term').textContent = data.semantic_term;
        $('astCount').textContent = data.comparison.ast_nodes;
        $('treeCount').textContent = data.comparison.parse_tree_nodes;
        showStatus('Синтаксис коректний. AST і семантичний терм побудовано.', 'ok');
        setTab('semanticPanel');
      } catch (error) { showStatus(errorText(error), 'error'); }
    });
    $('run').addEventListener('click', async () => {
      showStatus('Виконую програму…');
      try {
        const data = await api('/api/run', {source:$('source').value, state:$('state').value, step_limit:Number($('limit').value)});
        $('stateOut').textContent = JSON.stringify(data.state, null, 2);
        $('term').textContent = data.semantic_term;
        $('steps').textContent = data.steps;
        $('trace').innerHTML = data.events.map((e,i) => `<tr><td>${i+1}</td><td>${e.kind}</td><td>${e.span.line}:${e.span.column}</td><td><pre>${JSON.stringify(e.payload)}</pre></td></tr>`).join('');
        showStatus('Програму успішно виконано.', 'ok');
        setTab('statePanel');
      } catch (error) { showStatus(errorText(error), 'error'); }
    });
    loadSample('parity');
  </script>
</body>
</html>
